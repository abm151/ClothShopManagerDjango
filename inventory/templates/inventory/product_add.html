{% extends "dashboard/base.html" %}

{% block content %}

<h2>➕ Add Product</h2>

<div class="card p-4 mt-4">

<form method="POST">

{% csrf_token %}

<div class="mb-3">
    <label class="form-label">SKU Code</label>
    <input
        type="text"
        class="form-control"
        name="sku"
        required>
</div>

<div class="mb-3">
    <label class="form-label">Barcode</label>
    <input
        type="text"
        class="form-control"
        name="barcode"
        required>
</div>

<div class="mb-3">
    <label class="form-label">Product Name</label>
    <input
        type="text"
        class="form-control"
        name="name"
        required>
</div>

<div class="mb-3">
    <label class="form-label">Brand</label>
    <input
        type="text"
        class="form-control"
        name="brand"
        required>
</div>

<div class="mb-3">
    <label class="form-label">Category</label>
    <input
        type="text"
        class="form-control"
        name="category"
        required>
</div>

<div class="mb-3">
    <label class="form-label">Size</label>
    <input
        type="text"
        class="form-control"
        name="size">
</div>

<div class="mb-3">
    <label class="form-label">Color</label>
    <input
        type="text"
        class="form-control"
        name="color">
</div>

<div class="mb-3">
    <label class="form-label">Purchase Price</label>
    <input
        type="number"
        step="0.01"
        class="form-control"
        name="purchase_price"
        required>
</div>

<div class="mb-3">
    <label class="form-label">Selling Price</label>
    <input
        type="number"
        step="0.01"
        class="form-control"
        name="selling_price"
        required>
</div>

<div class="mb-3">
    <label class="form-label">Quantity</label>
    <input
        type="number"
        class="form-control"
        name="quantity"
        required>
</div>

<button type="submit" class="btn btn-success">
Save Product
</button>

</form>

</div>

{% endblock %}
