<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClothERP</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background: #f4f6f9;
        }

        .sidebar {
            width: 240px;
            height: 100vh;
            position: fixed;
            background: #1d3557;
            color: white;
        }

        .sidebar h3 {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 14px 20px;
        }

        .sidebar a:hover {
            background: #274c77;
        }

        .content {
            margin-left: 240px;
            padding: 30px;
        }

    </style>

</head>


<body>


<div class="sidebar">

    <h3>👔 ClothERP</h3>


    <a href="/">
        <i class="bi bi-speedometer2"></i>
        Dashboard
    </a>


    <a href="/products/">
        <i class="bi bi-box-seam"></i>
        Products
    </a>


    <a href="#">
        <i class="bi bi-truck"></i>
        Purchase
    </a>


    <a href="#">
        <i class="bi bi-building"></i>
        Suppliers
    </a>


    <a href="#">
        <i class="bi bi-cart-check"></i>
        POS
    </a>


    <a href="#">
        <i class="bi bi-bar-chart"></i>
        Reports
    </a>


    <a href="#">
        <i class="bi bi-gear"></i>
        Settings
    </a>


</div>



<div class="content">


    {% block content %}

    {% endblock %}


</div>



</body>
</html>
